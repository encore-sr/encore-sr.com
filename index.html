<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Encore SR — Made by humans." />
    <link rel="icon" type="image/png" href="/assets/encore.png" />
    <title>Encore SR</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-size: 100%;
      }

      body {
        font-family: monospace;
        background: #000;
        color: #fff;
        line-height: 1.5;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        text-align: left;
        max-width: 800px;
        width: 100%;
        position: relative;
        padding-left: calc(clamp(3rem, 12vw, 8rem) * 1.15);
      }

      h1 {
        font-size: clamp(3rem, 12vw, 8rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        text-indent: -0.04em;
        line-height: 0.95;
        margin-bottom: 0.5rem;
        position: static;
      }

      .logo {
        position: absolute;
        left: 0;
        top: -0.025em;
        height: 1em;
        width: auto;
        transform-origin: center;
      }

      .logo:hover {
        animation: spin 2.4s ease-in-out infinite;
        cursor: pointer;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      .subtitle {
        font-size: clamp(1rem, 3vw, 1.5rem);
        color: #888;
        font-weight: 400;
        max-width: 50ch;
        margin-bottom: 2rem;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }

      a {
        color: #fff;
        text-decoration: none;
        border: 2px solid #fff;
        padding: 0.75rem 1.5rem;
        font-size: 0.875rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition: background 0.1s, color 0.1s;
      }

      a:hover {
        background: #fff;
        color: #000;
      }

      hr {
        border: none;
        border-top: 1px solid #333;
        margin: 3rem 0;
      }

      footer {
        font-size: 0.75rem;
        color: #444;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      @media (prefers-color-scheme: light) {
        body {
          background: #fff;
          color: #000;
        }

        .subtitle {
          color: #666;
        }

        a {
          color: #000;
          border-color: #000;
        }

        a:hover {
          background: #000;
          color: #fff;
        }

        hr {
          border-top-color: #ccc;
        }

        footer {
          color: #999;
        }
      }
    </style>

    <script defer src="https://analytics.encore-sr.com/script.js" data-website-id="dec1cfe1-30bb-4462-9608-fa679badbba1"></script>
    <script defer src="https://analytics.encore-sr.com/recorder.js" data-website-id="dec1cfe1-30bb-4462-9608-fa679badbba1"></script>
  </head>
  <body>
    <main>
      <h1><img class="logo" src="/assets/encore.png" alt="Encore STEM Racing team logo" />Encore</h1>
      <p class="subtitle">Made by humans.</p>
      <div class="links"><a href="https://instagram.com/encore_sr" target="_blank" rel="noopener">Instagram</a><a href="https://www.linkedin.com/company/encore_sr" target="_blank" rel="noopener">LinkedIn</a><a href="https://discord.gg/dj2phSdJxk" target="_blank" rel="noopener">Discord</a><a href="https://whatsapp.com/channel/0029VbBRYAE2P59kigjboH0n" target="_blank" rel="noopener">WhatsApp</a></div>
      <hr />
      <footer>© 2026 Encore. This is a filler page.</footer>
    </main>
  </body>
</html>
